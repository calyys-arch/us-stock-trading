[project]
name = "us-stock-trading"
version = "0.1.0"
description = "US equities quantitative day-trading system (Ernie Chan methodology: cointegrated pairs trading + cross-sectional mean reversion, Kelly capital allocation)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
