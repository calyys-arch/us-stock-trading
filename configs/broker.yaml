# Data-source / broker configuration for the LIVE dashboard engine
# (dashboard/engine_bridge.py). This is a deliberate config-file switch, not
# a dashboard UI toggle — same "operational decision, not a UI button"
# philosophy as configs/strategy.yaml's auto_execute (forex-trading lesson
# #2, docs/lessons_from_forex_trading.md). Restart the dashboard backend
# (scripts/start_dashboard.py) after changing this file for it to take
# effect.
#
# data_source: simulated
#   Clicking "Start (Paper)" runs a fully in-memory SimulatedFeed +
#   SimBroker. Zero external network connections. This is the safe default
#   and requires NO IB Gateway/TWS to be running.
#
# data_source: ibkr_paper
#   Clicking "Start (Paper)" makes a REAL connection to IB Gateway or TWS on
#   the ports below. You MUST have IB Gateway/TWS already running and
#   logged into your PAPER trading account first, or the connection will
#   fail/keep retrying — the dashboard status bar will show
#   "IBKR: Disconnected" rather than silently pretending to be live.
#   NEVER point broker_port/feed_port at a LIVE-account port (4001/7496)
#   from this MVP dashboard — there is no live-trading UI safety net here.
#
# data_source: futu_live
#   Clicking "Start (Paper)" runs the live engine against REAL Futu-sourced
#   tick + Level-2 data, via python/interfaces/futu_live_feed.py's
#   FutuLiveFeed. Unlike ibkr_paper, this does NOT open any new broker/feed
#   connection of its own — it TAILS the data/ticks/<SYMBOL>/<date>.jsonl and
#   data/depth/<SYMBOL>/<date>.jsonl files that
#   `scripts/capture_market_microstructure.py --source futu` is already
#   writing, so it needs zero additional Futu subscription quota and cannot
#   interfere with that script's own connection. Requirements before using
#   this: (1) the capture script must already be running and actively
#   writing TODAY's files for the symbols you care about (OpenD must be
#   logged in for THAT process, not for this dashboard — this feed opens no
#   Futu socket at all); (2) if the capture script isn't running yet /
#   hasn't written today's file for a symbol, that symbol just emits no
#   ticks (logged once, not a crash) until the file appears. The broker
#   stays SimBroker in this mode — this is real DATA, still-paper/observe
#   EXECUTION (docs/microstructure_pivot_plan.md §7's Phase 2, strictly
#   observe-only).
#
# NOTE: this key only gates dashboard/engine_bridge.py's EngineRuntime (the
# "Start (Paper)" button in the web dashboard). It has no effect on the
# offline backtest/WFO scripts (python/data/price_cache.py uses
# historical_data_source below) or on scripts/capture_market_microstructure.py
# itself (that script's --source flag is independent of this switch, and it
# must already be running on its own for data_source: futu_live to have
# anything to tail).
#
# 2026-08-15 paper-forward experiment: the checked-in default is futu_live
# so Start (Paper) tails real Futu capture rather than a SimulatedFeed
# (a simulated feed would make the experiment fake). Broker stays SimBroker
# — PAPER execution, never a live IBKR money path. Requires OpenD +
# `scripts/capture_market_microstructure.py --source futu` already running.
# See backtests/reports/absorption_breakout_paper_protocol.md.
data_source: futu_live

# Where BACKTEST/RESEARCH historical daily bars come from
# (python/data/price_cache.py):
#   ibkr     — IB Gateway ADJUSTED_LAST daily bars (python/data/ibkr_price_source.py);
#              same source family as the live execution path. If IB Gateway is
#              not running, price_cache logs a warning and falls back to
#              yfinance — the run proceeds, and reports label the actual source.
#   yfinance — skip IB entirely (python/simulation/hist_data_us.py).
#
# Set to yfinance for a measured reason, not a convenience one. With IB Gateway
# logged in and serving (verified 2026-08-27, account DUR123449), IBKR
# ADJUSTED_LAST closes and yfinance auto_adjust closes agree to a median of
# 0.0008% and a worst case of 0.0085% over 664 overlapping days on SPY/AAPL/
# TLT/GLD -- the same numbers to four decimal places on the latest bar. So
# there is no accuracy argument between them. There is a large speed one: IBKR
# historical requests are paced per contract, and the Strategy V1 daily top-up
# needs 120 symbols, which stalled outright (16 minutes, 0% CPU, zero symbols
# written) where the batched yfinance path finishes in seconds. Switch back to
# ibkr for a small universe or to cross-check a suspicious series.
historical_data_source: yfinance

# Whose commission schedule the portfolio work charges
# (python/portfolio/broker_costs.py). This is NOT cosmetic and NOT just a
# question of how big the bill is: per share the two are within a hundredth of
# a cent, but IBKR lets its 1% cap override the per-order minimum while Futu
# lets the minimum override its 0.5% cap. That single difference makes a $25
# rebalance order cost $0.25 at IBKR and $1.99 at Futu, and it decides whether
# maintaining constituent weights is worth doing at all.
#   ibkr — IBKR Pro Fixed: 0.005/share, min 1.00, cap 1% (cap wins).
#   futu — Futu HK fixed platform plan: commission 0.0049/share min 0.99 PLUS
#          platform fee 0.005/share min 1.00 (so a 1.99 floor), cap 0.5% but
#          the floor wins, plus 0.003/share settlement.
#   none — commission-free routing; the 4bps spread assumption carries the bill.
# Measured consequence of the choice, at $100k across 120 instruments over
# 2018-2026 (backtests/reports/retail_cost_study.json): with no no-trade band
# Futu costs 3.76%/yr against IBKR's 1.16%, and fractional shares flip from the
# single largest improvement (+0.73pp CAGR at IBKR) to a 1.23pp LOSS, because
# fractional targets generate a small order in every name every month and Futu
# has no cap to make those cheap. Integer rounding accidentally acts as a
# no-trade band there. At $25k the fractional-at-Futu case does not merely
# underperform, it terminates: 15.9 rebalances a year x ~112 orders x ~$2 is
# $2,896 in year one against $25,000 of capital, and the ledger ends at $2,987.
broker: ibkr

ibkr:
  host: 127.0.0.1
  feed_port: 4002          # IB Gateway paper=4002, TWS paper=7497
  broker_port: 4002        # IB Gateway paper=4002, TWS paper=7497
  feed_client_id: 11       # must differ from broker_client_id
  broker_client_id: 21
  historical_client_id: 31   # research/backtest historical fetches (python/data/ibkr_price_source.py)
  tick_capture_client_id: 41 # tick/Level-2 depth capture (python/interfaces/ibkr_tick_capture.py)

# Alternative tick/Level-2 capture source (python/interfaces/futu_tick_capture.py),
# used instead of the ibkr: block above when scripts/capture_market_microstructure.py
# is run with --source futu. Added 2026-08-04 because the IB Gateway session in use
# turned out to be a free-standing IBKR Demo account (no linked live brokerage
# account -> no real-time market-data subscription is possible, see README's
# "never market order" section for the broader safety context). A funded
# Futu/Moomoo account with LV3 quote permission can stream genuine real-time
# tick-by-tick + Level-2 depth for US equities instead, through OpenD — Futu's
# local gateway app (must already be running & logged in; default port 11111,
# same "local-only, never remote" posture as ibkr.host above).
futu:
  host: 127.0.0.1
  port: 11111
  market_prefix: US   # OpenD stock codes are "<MARKET>.<SYMBOL>", e.g. US.AAPL
  # Only needed if OpenD's "Encrypted Private Key" setting (API Service tab
  # in the OpenD desktop app) is filled in — leave blank/commented if it's
  # empty. Must be the SAME file OpenD itself is configured with, or every
  # connection attempt fails with "check sha error!" on InitConnect
  # (python/interfaces/futu_tick_capture.py's "Protocol encryption" note).
  # Left blank here (machine-specific path) — set locally, don't commit it.
  rsa_key_path: ""
