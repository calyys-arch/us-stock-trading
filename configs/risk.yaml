# Risk configuration — see python/core/risk_engine.py:RiskConfig for the
# authoritative field list and enforcement points. Every key here MUST have
# a matching test in tests/test_config_enforcement.py (forex-trading lesson
# #2: a dead config key, auto_execute, existed with no enforcement — see
# docs/lessons_from_forex_trading.md).

max_adv_participation_pct: 0.01     # 1% of 20-day ADV per order (Chan p.85-90)
max_sector_exposure_pct: 0.30       # 30% of gross capital per GICS sector
max_single_position_pct: 0.10       # 10% of gross capital per name

pdt_equity_threshold: 25000.0       # FINRA Pattern Day Trader threshold (USD)
max_day_trades_rolling_5d: 3        # FINRA Rule 4210 limit below the PDT threshold

reg_t_intraday_leverage: 4.0        # Reg T day-trading buying power (PDT-qualified accounts)
reg_t_overnight_leverage: 2.0       # Reg T overnight/Strategy-A leverage cap

kelly_multiplier: 0.5               # half-Kelly haircut (Chan p.70)
max_gross_leverage: 2.0             # portfolio-wide gross leverage cap post-Kelly

require_short_locate: true          # hard-reject any short leg without a locate
min_price: 5.0                      # Chan Ch.5: exclude sub-$5 stocks

# Acceptance gate (forex lesson #4: transaction costs dominated gross edge
# in every one of 9 forex strategies except a thin slice of one).
min_gross_to_cost_ratio: 2.0        # gross expectancy must be >= 2x round-trip cost

# Order-type / execution-price controls (user decision, 2026-07-29: always
# Limit/Stop-Limit, never Market — control exact execution price, avoid
# PFOF-routed market-order fills). Enforced at python/core/execution_gateway
# .py's ExecutionGateway._submit_order chokepoint, the only place in that
# class allowed to call broker.place_order.
limit_price_buffer_bps: 10.0         # 0.10% marketable-limit buffer, fresh entries
flatten_limit_buffer_bps: 25.0       # wider buffer for urgent flatten/exit orders
stop_limit_buffer_bps: 15.0          # stop trigger -> limit cap offset, protective exits

# Intraday microstructure signal controls (RiskEngine.qualify_microstructure_order)
micro_risk_per_trade_pct: 0.01       # 1% account risk per trade, stop-distance sizing
max_intraday_notional_pct: 0.05      # per-position cap, pct of account equity
max_open_micro_positions: 5
max_daily_loss_pct: 0.02             # daily-loss kill-switch: halt new micro entries for the day
event_blackout_minutes: 30           # +/- window around earnings/8-K/econ events (see python/core/event_blackout.py)
micro_cancel_after_seconds: 60       # auto-cancel an unfilled entry limit after this long

# Paper-forward-test hard dollar cap (2026-08-15). Applied as an ADDITIONAL
# ceiling on top of the pct caps above — does not loosen any existing gate.
# A few thousand USD per trade, well under max_intraday_notional_pct of the
# SimBroker $1M default equity. See backtests/reports/absorption_breakout_paper_protocol.md.
paper_max_notional_usd: 3000.0
