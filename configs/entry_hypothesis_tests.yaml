# All 15 entry hypotheses, scored as 7 independent gates (no AND).
# Intraday names that already have a decision-chart knob are compared
# on 1m / 5m / 15m. 1m-native session signals stay on 1m. Daily
# hypotheses have no intraday chart — they get one daily column.
#
# Official research GO (hard AND) is unchanged. auto_execute is unchanged.

combination_mode: single_gates

gate_names:
  - wfo_go
  - oos_drawdown_within_limit
  - has_oos_trades
  - min_trades_per_oos_fold
  - cost_adjusted_profit_factor
  - monte_carlo_p5_sharpe
  - stress_slippage_1.5x_pf_ge_1

routes:
  pairs_trading:
    signal: pairs_trading
    kind: daily
    charts: [0]
  xsection_mean_reversion:
